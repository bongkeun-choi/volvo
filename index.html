<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>볼보에러 - Volvo 진단 뷰어</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="볼보에러">
  <meta name="application-name" content="볼보에러">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%230f172a'/%3E%3Crect x='18' y='18' width='476' height='476' rx='98' fill='none' stroke='%2338bdf8' stroke-width='14'/%3E%3Ctext x='256' y='135' font-family='Arial' font-size='42' font-weight='900' fill='%23fff' text-anchor='middle'%3EVOLVO%3C/text%3E%3Cpath d='M256 160 L405 340 H107 Z' fill='none' stroke='%23f59e0b' stroke-width='22' stroke-linejoin='round'/%3E%3Crect x='243' y='210' width='26' height='70' rx='13' fill='%23fbbf24'/%3E%3Ccircle cx='256' cy='310' r='14' fill='%23fbbf24'/%3E%3Crect x='70' y='385' width='372' height='80' rx='22' fill='%23dc2626'/%3E%3Ctext x='256' y='441' font-family='sans-serif' font-size='42' font-weight='900' fill='%23fff' text-anchor='middle'%3E볼보에러%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%230f172a'/%3E%3Crect x='18' y='18' width='476' height='476' rx='98' fill='none' stroke='%2338bdf8' stroke-width='14'/%3E%3Ctext x='256' y='135' font-family='Arial' font-size='42' font-weight='900' fill='%23fff' text-anchor='middle'%3EVOLVO%3C/text%3E%3Cpath d='M256 160 L405 340 H107 Z' fill='none' stroke='%23f59e0b' stroke-width='22' stroke-linejoin='round'/%3E%3Crect x='243' y='210' width='26' height='70' rx='13' fill='%23fbbf24'/%3E%3Ccircle cx='256' cy='310' r='14' fill='%23fbbf24'/%3E%3Crect x='70' y='385' width='372' height='80' rx='22' fill='%23dc2626'/%3E%3Ctext x='256' y='441' font-family='sans-serif' font-size='42' font-weight='900' fill='%23fff' text-anchor='middle'%3E볼보에러%3C/text%3E%3C/svg%3E">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif; }
    
    :root {
      --app-bg: #e2e8f0; --app-header-bg: #0f172a; --app-header-text: #ffffff;
      --search-bg: #ffffff; --search-border: #94a3b8; --search-text: #000000;
      --chip-bg: #cbd5e1; --chip-text: #0f172a; --status-text: #475569;
    }
    body.theme-dark {
      --app-bg: #0b0f19; --app-header-bg: #111827; --app-header-text: #f3f4f6;
      --search-bg: #1f2937; --search-border: #374151; --search-text: #38bdf8;
      --chip-bg: #1f2937; --chip-text: #94a3b8; --status-text: #64748b;
    }
    body { background: var(--app-bg); color: #000; padding-bottom: 60px; transition: background 0.25s ease; }

    .app-header {
      position: sticky; top: 0; z-index: 1000;
      background: var(--app-header-bg); color: var(--app-header-text);
      padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .brand-title { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 900; }
    .header-btns { display: flex; align-items: center; gap: 5px; }
    
    .btn-nav-parser {
      background: #0284c7; border: none; color: white;
      padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 800;
      text-decoration: none; display: flex; align-items: center; gap: 4px;
    }
    .btn-install {
      background: #dc2626; border: none; color: white;
      padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 900;
      display: flex; align-items: center; gap: 3px;
    }
    .btn-refresh {
      background: rgba(255,255,255,0.15); border: none; color: white;
      padding: 6px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 700;
    }

    .container { padding: 14px; max-width: 840px; margin: 0 auto; }

    .mode-switcher {
      display: flex; background: rgba(0,0,0,0.15); padding: 4px; border-radius: 12px;
      margin-bottom: 12px; gap: 4px;
    }
    body.theme-dark .mode-switcher { background: #1e293b; }
    
    .mode-btn {
      flex: 1; padding: 9px 4px; border: none; border-radius: 9px;
      font-size: 12.5px; font-weight: 800; cursor: pointer; background: transparent;
      color: #64748b; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .mode-btn.active { background: #ffffff; color: #0f172a; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    body.theme-dark .mode-btn.active { background: #38bdf8; color: #0f172a; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }

    .search-wrapper { position: relative; margin-bottom: 10px; }
    .search-input {
      width: 100%; padding: 14px 44px 14px 16px; font-size: 16px; font-weight: 800;
      border: 2px solid var(--search-border); border-radius: 10px; background: var(--search-bg); color: var(--search-text);
      outline: none; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .search-input:focus { border-color: #0284c7; }
    .clear-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: #94a3b8; border: none; width: 24px; height: 24px;
      border-radius: 50%; color: white; font-weight: bold; cursor: pointer; display: none;
    }
    .autocomplete-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: white; border: 1px solid #cbd5e1; border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15); max-height: 250px; overflow-y: auto; z-index: 999; display: none;
    }
    .autocomplete-item { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-weight: 700; color: #dc2626; }
    .autocomplete-item:hover { background: #f0f9ff; }

    .chips-container { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; scrollbar-width: none; }
    .chips-container::-webkit-scrollbar { display: none; }
    .chip { background: var(--chip-bg); color: var(--chip-text); padding: 6px 13px; border-radius: 16px; font-size: 12.5px; font-weight: 800; white-space: nowrap; cursor: pointer; }

    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 12px; color: var(--status-text); font-weight: 700; }
    .empty-state { text-align: center; padding: 60px 20px; color: #64748b; font-weight: 700; font-size: 14.5px; line-height: 1.6; }

    /* 아코디언 */
    .accordion-item {
      background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 12px;
      margin-bottom: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    body.theme-dark .accordion-item { background: #1e293b; border-color: #334155; }
    
    .accordion-header {
      padding: 14px 16px; cursor: pointer; display: flex;
      align-items: center; justify-content: space-between;
      background: #f8fafc; user-select: none;
    }
    body.theme-dark .accordion-header { background: #1e293b; }
    .accordion-item.open .accordion-header { background: #f0f9ff; border-bottom: 1.5px solid #bae6fd; }
    body.theme-dark .accordion-item.open .accordion-header { background: #0f2544; border-bottom-color: #1e40af; }

    .acc-header-info { display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .acc-tags-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .acc-tag-dtc { background: #dc2626; color: white; padding: 2px 7px; border-radius: 4px; font-size: 12px; font-weight: 900; }
    .acc-tag-model { background: #0284c7; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11.5px; font-weight: 800; }
    .acc-tag-type { background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 4px; font-size: 11.5px; font-weight: 800; border: 1px solid #fde68a; }

    .acc-chevron { font-size: 16px; font-weight: 900; color: #64748b; transition: transform 0.25s ease; }
    .accordion-item.open .acc-chevron { transform: rotate(180deg); color: #0284c7; }

    .accordion-content { display: none; padding: 14px; background: inherit; }
    .accordion-item.open .accordion-content { display: block; }

    /* ========================================================
       📄 정통 매뉴얼 OEM 스타일 (ISO & SAE 완벽 복원)
    ======================================================== */
    .mode-oem-sheet { background: #ffffff; padding: 25px 20px; border: 1px solid #94a3b8; color: #000; }
    .oem-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .oem-title-code { font-size: 18px; font-weight: 900; color: #000; }
    .oem-btn-profile { border: 1px solid #666; padding: 3px 8px; font-size: 11px; font-weight: bold; background: #fff; }
    
    .oem-sec-title { font-size: 12px; font-weight: 900; margin: 12px 0 4px 0; color: #000; }
    .oem-tbl { width: 100%; border-collapse: collapse; border: 1.5px solid #000000; margin-bottom: 10px; font-size: 12px; color: #000; }
    .oem-tbl th, .oem-tbl td { border: 1px solid #000000; padding: 6px 8px; vertical-align: top; }
    .oem-tbl th { background: #d9d9d9; font-weight: 800; text-align: left; }
    .oem-bullet-row { display: flex; align-items: flex-start; gap: 5px; margin-bottom: 3px; line-height: 1.4; }
    .oem-stamp { text-align: right; margin-top: 14px; }
    .oem-stamp-box { display: inline-block; border: 1px solid #999; color: #777; padding: 2px 7px; border-radius: 4px; font-size: 11px; }

    /* FMI 다중 블록 테이블 전용 스타일 */
    .fmi-sub-title { font-weight: 900; color: #000; font-size: 12.5px; }
    .fmi-lbl { font-weight: 800; color: #000; margin-bottom: 2px; }

    /* 모던 카드 / 다크 모드 */
    .m-card { background: #ffffff; border-radius: 10px; padding: 16px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
    .m-hero { border-left: 5px solid #0284c7; }
    .d-card { background: #0f172a; border-radius: 10px; padding: 16px; margin-bottom: 10px; border: 1px solid #334155; color: #fff; }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="brand-title">
      <span>🚜</span>
      <span>볼보에러</span>
    </div>
    <div class="header-btns">
      <a href="parser.html" class="btn-nav-parser">📂 캡처/문서 분석</a>
      <button id="btnInstallApp" class="btn-install" onclick="triggerInstallPrompt()">📲 앱 설치</button>
      <button class="btn-refresh" onclick="fetchData()">새로고침</button>
    </div>
  </div>

  <div class="container">
    <div class="mode-switcher">
      <button class="mode-btn active" id="btnModeOem" onclick="setViewerMode('oem')">📄 정통 매뉴얼</button>
      <button class="mode-btn" id="btnModeCard" onclick="setViewerMode('card')">🗂️ 모던 카드</button>
      <button class="mode-btn" id="btnModeDark" onclick="setViewerMode('dark')">⚡ 현장 다크</button>
    </div>

    <div class="search-wrapper">
      <input type="text" id="searchInput" class="search-input" placeholder="에러코드(P206A13, MID187 PID91, 187 PID91 등) 입력..." autocomplete="off" oninput="onSearchInput()" onfocus="onSearchInput()">
      <button id="clearBtn" class="clear-btn" onclick="clearSearch()">×</button>
      <div id="autocompleteList" class="autocomplete-dropdown"></div>
    </div>

    <div class="chips-container" id="quickChips"></div>

    <div class="status-bar">
      <span id="dataCount">DB 연결 중...</span>
      <span id="currentModeLabel">모드: 정통 매뉴얼</span>
    </div>

    <div id="resultsList">
      <div class="empty-state">
        🔍 조회할 <b>DTC 고장 코드</b>를 검색창에 입력하거나<br>위의 바로가기 버튼을 선택해 주세요.
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzV5H2kowUqmGNO2UloeU_2OMYT0ZbyyzsS3iN4LXLhY_WvZ1maxiIOZ9jvvCg99aM/exec";
    let dtcData = [];
    let currentFiltered = [];
    let currentMode = localStorage.getItem('volvo_viewer_mode') || 'oem';
    let deferredPrompt = null;

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});

    window.onload = () => {
      setViewerMode(currentMode, false);
      fetchData();
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-wrapper')) closeAutocomplete();
      });
    };

    function setViewerMode(mode, shouldRerender = true) {
      currentMode = mode;
      localStorage.setItem('volvo_viewer_mode', mode);

      document.getElementById('btnModeOem').classList.toggle('active', mode === 'oem');
      document.getElementById('btnModeCard').classList.toggle('active', mode === 'card');
      document.getElementById('btnModeDark').classList.toggle('active', mode === 'dark');
      document.body.classList.toggle('theme-dark', mode === 'dark');

      const modeNames = { oem: '정통 매뉴얼', card: '모던 카드 대시보드', dark: '현장 특화 다크모드' };
      document.getElementById('currentModeLabel').innerText = `모드: ${modeNames[mode]}`;

      if (shouldRerender && currentFiltered.length > 0) renderCards(currentFiltered);
    }

    async function fetchData() {
      try {
        const res = await fetch(API_URL, { method: 'GET', redirect: 'follow' });
        const data = await res.json();
        
        if (Array.isArray(data)) {
          dtcData = data;
          document.getElementById('dataCount').innerText = `총 ${dtcData.length}건 등록됨`;
          renderQuickChips();

          const currQ = document.getElementById('searchInput').value.trim();
          if (currQ) filterResults(currQ.toLowerCase());
        }
      } catch (err) {
        document.getElementById('resultsList').innerHTML = `<div class="empty-state" style="color:#dc2626;"><b>데이터 로딩 실패</b><br><br>${err.message}</div>`;
      }
    }

    function renderQuickChips() {
      const chipBox = document.getElementById('quickChips');
      const uniqueCodes = [...new Set(dtcData.map(d => d.dtc || d.displayMsg).filter(Boolean))];
      chipBox.innerHTML = uniqueCodes.slice(0, 15).map(code => 
        `<span class="chip" onclick="selectKeyword('${code}')">${code}</span>`
      ).join('');
    }

    function onSearchInput() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const clearBtn = document.getElementById('clearBtn');
      const acList = document.getElementById('autocompleteList');

      clearBtn.style.display = q ? 'block' : 'none';

      if (!q) {
        closeAutocomplete();
        showInitialEmptyState();
        currentFiltered = [];
        document.getElementById('dataCount').innerText = `총 ${dtcData.length}건 등록됨`;
        return;
      }

      const matches = dtcData.filter(item => {
        const text = `${item.dtc||''} ${item.displayMsg||''} ${item.compFull||''} ${item.paramName||''} ${item.modelType||''}`.toLowerCase();
        return text.includes(q);
      }).slice(0, 6);

      if (matches.length > 0) {
        acList.innerHTML = matches.map(item => `
          <div class="autocomplete-item" onclick="selectKeyword('${item.dtc || item.displayMsg}')">
            ${item.dtc} ${item.displayMsg ? '/ ' + item.displayMsg : ''} <span style="font-size:12px; color:#64748b;">(${item.modelType||''})</span>
          </div>
        `).join('');
        acList.style.display = 'block';
      } else {
        closeAutocomplete();
      }

      filterResults(q);
    }

    function selectKeyword(keyword) {
      document.getElementById('searchInput').value = keyword;
      document.getElementById('clearBtn').style.display = 'block';
      closeAutocomplete();
      filterResults(keyword.toLowerCase());
    }

    function closeAutocomplete() {
      document.getElementById('autocompleteList').style.display = 'none';
    }

    function filterResults(q) {
      currentFiltered = dtcData.filter(item => {
        return Object.values(item).some(val => {
          if (typeof val === 'object') return JSON.stringify(val).toLowerCase().includes(q);
          return String(val).toLowerCase().includes(q);
        });
      });

      renderCards(currentFiltered);
      document.getElementById('dataCount').innerText = `검색 결과: ${currentFiltered.length}건`;
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearBtn').style.display = 'none';
      currentFiltered = [];
      closeAutocomplete();
      showInitialEmptyState();
      document.getElementById('dataCount').innerText = `총 ${dtcData.length}건 등록됨`;
    }

    function showInitialEmptyState() {
      document.getElementById('resultsList').innerHTML = `
        <div class="empty-state">
          🔍 조회할 <b>DTC 고장 코드</b>를 검색창에 입력하거나<br>위의 바로가기 버튼을 선택해 주세요.
        </div>
      `;
    }

    function toggleAccordion(idx) {
      const item = document.getElementById(`accItem_${idx}`);
      if (item) item.classList.toggle('open');
    }

    const splitToList = (str) => {
      if (!str || str === '없음') return [];
      return str.split('|').map(s => s.trim()).filter(s => s);
    };

    function renderCards(items) {
      const resultsList = document.getElementById('resultsList');
      resultsList.innerHTML = '';

      if (items.length === 0) {
        resultsList.innerHTML = '<div class="empty-state">일치하는 진단서가 없습니다. 🔍</div>';
        return;
      }

      items.forEach((d, idx) => {
        const accItem = document.createElement('div');
        const isOpen = (items.length === 1 || idx === 0) ? 'open' : '';
        accItem.className = `accordion-item ${isOpen}`;
        accItem.id = `accItem_${idx}`;

        const isSae = (d.type === 'sae');
        const typeBadge = isSae 
          ? `<span class="acc-tag-type">SAE J1939</span>` 
          : `<span class="acc-tag-type" style="background:#e0f2fe; color:#0369a1; border-color:#bae6fd;">ISO DTC</span>`;

        let contentHtml = '';
        if (isSae) {
          contentHtml = renderSaeOemStyle(d);
        } else {
          contentHtml = renderIsoOemStyle(d);
        }

        accItem.innerHTML = `
          <div class="accordion-header" onclick="toggleAccordion(${idx})">
            <div class="acc-header-info">
              <div class="acc-tags-row">
                <span class="acc-tag-dtc">${d.dtc}</span>
                <span class="acc-tag-model">${d.modelType || 'Volvo'}</span>
                ${typeBadge}
              </div>
              <div style="font-size:13px; font-weight:700; color:#475569;">
                ${isSae ? (d.paramName || 'SAE 진단') : (d.event || d.compFull || '')}
              </div>
            </div>
            <div class="acc-chevron">▼</div>
          </div>
          <div class="accordion-content">
            ${contentHtml}
          </div>
        `;

        resultsList.appendChild(accItem);
      });
    }

    // ========================================================
    // 🚜 [SAE 양식] PDF 원본 100% 동일 복원 렌더러
    // ========================================================
    function renderSaeOemStyle(d) {
      const renderBullets = (arr) => {
        if (!arr || arr.length === 0) return `<div class="oem-bullet-row"><span>○</span><span>없음</span></div>`;
        return arr.map(t => `<div class="oem-bullet-row"><span>○</span><span>${t}</span></div>`).join('');
      };

      let fmiRowsHtml = '';
      const fList = d.fmiList || [];
      fList.forEach(f => {
        fmiRowsHtml += `
          <tr>
            <td style="width: 20%; font-weight: bold; background: #fafafa;">
              <div class="fmi-sub-title">고장 모드</div>
              <div style="font-size: 14px; font-weight: 900; color:#dc2626; margin-top:4px;">FMI ${f.fmi}</div>
            </td>
            <td style="width: 80%;">
              <div class="fmi-lbl"><b>탐지 조건:</b> ${f.cond || '-'}</div>
              <div style="margin-top: 8px;" class="fmi-lbl"><b>증상:</b></div>
              ${renderBullets(splitToList(f.symptom))}
              <div style="margin-top: 8px;" class="fmi-lbl"><b>가능한 이유:</b></div>
              ${renderBullets(splitToList(f.causes))}
              <div style="margin-top: 8px;" class="fmi-lbl"><b>조치:</b> ${f.actions || '-'}</div>
            </td>
          </tr>
        `;
      });

      return `
        <div class="mode-oem-sheet">
          <div class="oem-top-bar">
            <div class="oem-title-code">${d.dtc} ${d.displayMsg ? '/ ' + d.displayMsg : ''}</div>
            <button class="oem-btn-profile">모든 프로필 표시</button>
          </div>

          <div class="oem-sec-title">일련 번호에 대해 유효</div>
          <table class="oem-tbl">
            <tr style="background:#f2f2f2; font-weight:bold;">
              <td style="width:35%;">모델 종류:</td>
              <td style="width:25%;">생산 사업장</td>
              <td style="width:20%;">일련 번호 시작</td>

              <td>${d.modelType || 'EW145B Volvo'}</td>

    // ========================================================
    // 📄 [ISO 양식] 기존 14개 필드 OEM 렌더러
    // ========================================================
    function renderIsoOemStyle(d) {
      const renderBullets = (arr) => {
        if (!arr || arr.length === 0) return `<div class="oem-bullet-row"><span>○</span><span>없음</span></div>`;
        return arr.map(t => `<div class="oem-bullet-row"><span>○</span><span>${t}</span></div>`).join('');
      };
      const renderPreDtcs = (str) => {
        const list = splitToList(str);
        if (list.length === 0) return `<div class="oem-bullet-row"><span>○</span><span>없음</span></div>`;
        return list.map(c => `<div class="oem-bullet-row"><span>○</span><span style="color:#0044cc; text-decoration:underline; cursor:pointer;" onclick="selectKeyword('${c}')">☍ ${c}</span></div>`).join('');
      };

      return `
        <div class="mode-oem-sheet">
          <div class="oem-top-bar">
            <div style="font-size:20px; font-weight:900; letter-spacing:6px; font-family:serif;">VOLVO</div>
            <div style="font-size:15px; font-weight:800;">Volvo 유도 진단</div>
          </div>
          <table class="oem-tbl">
            <tr>
              <td style="width: 25%;"><b>일자:</b><br>2026-08-17</td>
              <td style="width: 30%;"><b>정보 유형:</b><br>진단 오류 코드</td>
              <td style="width: 45%;"><b>프로필:</b><br><b>${d.modelType || 'EW140E Volvo'}</b></td>
            </tr>
          </table>
          <div style="font-size:22px; font-weight:900; margin:14px 0 16px 0;">${d.dtc}</div>
          <table class="oem-tbl">
            <tr><th colspan="4">일련 번호에 대해 유효</th></tr>
            <tr style="background:#f2f2f2; font-weight:bold;">
              <td style="width:35%;">모델 종류:</td><td style="width:25%;">생산 사업장</td><td style="width:20%;">일련 번호 시작</td><td style="width:20%;">일련 번호 종료</td>
            </tr>
            <tr>
              <td>${d.modelType || '-'}</td><td>${d.factory || '-'}</td><td>${d.serialStart || '-'}</td><td>${d.serialEnd || '-'}</td>
            </tr>
          </table>
          <table class="oem-tbl">
            <tr><th colspan="2">ISO DTC 코드</th></tr>
            <tr><td style="width: 35%;">컨트롤 유니트</td><td>${d.ecu || '엔진 컨트롤 모듈'}</td></tr>
            <tr><td>DTC 코드, 시스템/구성부품, 고장 유형</td><td><b>${d.compFull || d.dtc}</b></td></tr>
          </table>
          <table class="oem-tbl">
            <tr><td style="width: 20%; font-weight:bold;">기준</td><td><span style="color:#0044cc; text-decoration:underline;">${d.standard || '개요'}</span></td></tr>
          </table>
          <div style="font-size:13px; font-weight:800; margin:12px 0 6px 0;">진단</div>
          <table class="oem-tbl">
            <tr><td style="width: 25%; font-weight:bold;">고장 이벤트</td><td>${d.event || '-'}</td></tr>
            <tr><td style="font-weight:bold;">증상</td><td>${renderBullets(splitToList(d.symptom))}</td></tr>
            <tr><td style="font-weight:bold;">조건:</td><td>${renderBullets(splitToList(d.condition))}</td></tr>
            <tr><td style="font-weight:bold;">선행조치 DTC</td><td>${renderPreDtcs(d.preDtc)}</td></tr>
            <tr><td style="font-weight:bold;">가능한 이유</td><td>${renderBullets(splitToList(d.causes))}</td></tr>
            <tr><td style="font-weight:bold;">조치</td><td>${renderBullets(splitToList(d.actions))}</td></tr>
          </table>
          <div class="oem-stamp"><span class="oem-stamp-box">Guided Diagnostics</span></div>
        </div>
      `;
    }
  </script>
