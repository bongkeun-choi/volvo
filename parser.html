<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>볼보 DTC PDF 분석기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; }
    body { background: #f8fafc; color: #1e293b; padding-bottom: 60px; }
    
    .app-header {
      background: #0f172a; color: white; padding: 12px 18px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .app-header h1 { font-size: 15px; font-weight: 800; }
    .btn-home {
      background: #0284c7; color: white; text-decoration: none;
      padding: 6px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 800;
    }

    .container { max-width: 960px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 13.5px; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
    
    .drop-zone { border: 2px dashed #0284c7; padding: 40px 15px; text-align: center; border-radius: 12px; cursor: pointer; background: #f0f9ff; font-weight: 700; font-size: 15px; color: #0369a1; }
    .drop-zone:hover { background: #e0f2fe; }
    
    .progress-box { margin-top: 15px; display: none; }
    .progress-bar-bg { width: 100%; height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: #0284c7; transition: width 0.2s; }
    .progress-text { font-size: 12.5px; font-weight: bold; color: #475569; margin-top: 5px; text-align: right; }

    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { border: 1px solid #e2e8f0; padding: 9px 11px; text-align: left; }
    th { background: #f8fafc; font-weight: 700; color: #475569; }

    .badge { display: inline-block; padding: 3px 7px; border-radius: 4px; font-size: 11px; font-weight: 800; }
    .badge-new { background: #dcfce7; color: #166534; }
    .badge-dup { background: #fee2e2; color: #991b1b; }
    .badge-mod { background: #fef3c7; color: #92400e; }
    .badge-saved { background: #e0f2fe; color: #0369a1; }

    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .btn { padding: 12px 18px; border: none; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; }
    .btn-primary { background: #0284c7; color: white; flex: 2; }
    .btn-secondary { background: #64748b; color: white; flex: 1; }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>🛠️ 볼보 DTC 진단 PDF 일괄 분석기</h1>
    <a href="index.html" class="btn-home">🔍 진단서 조회 (홈)</a>
  </div>

  <div class="container">
    <div class="card">
      <div class="input-group">
        <label>Google Apps Script 웹 앱 URL:</label>
        <input type="text" id="scriptUrl" value="https://script.google.com/macros/s/AKfycbzV5H2kowUqmGNO2UloeU_2OMYT0ZbyyzsS3iN4LXLhY_WvZ1maxiIOZ9jvvCg99aM/exec">
      </div>
      
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        📂 볼보 진단 PDF 파일을 끌어다 놓거나 클릭하세요 (다중 파일 지원)
        <input type="file" id="fileInput" accept="application/pdf" multiple style="display: none;">
      </div>

      <div class="progress-box" id="progressBox">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">처리 중...</div>
      </div>
    </div>

    <div class="card" id="listCard" style="display: none;">
      <h3>📋 분석 결과 목록</h3>
      <table>
        <thead>
          <tr>
            <th style="width: 6%; text-align:center;"><input type="checkbox" id="checkAll" checked onclick="toggleCheckAll(this)"></th>
            <th style="width: 18%;">DTC 코드</th>
            <th style="width: 26%;">모델 / 제어기</th>
            <th style="width: 36%;">시스템/구성부품</th>
            <th style="width: 14%;">상태</th>
          </tr>
        </thead>
        <tbody id="fileTableBody"></tbody>
      </table>

      <div class="btn-group">
        <button class="btn btn-primary" id="btnBatchSave" onclick="startBatchSave()">선택 항목 구글 시트에 일괄 저장</button>
        <button class="btn btn-secondary" onclick="resetQueue()">목록 비우기</button>
      </div>
    </div>
  </div>

  <script>
    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = '';
    let parsedQueue = [];
    let existingSheetData = [];

    const fieldLabels = [
      { key: 'dtc', label: '에러코드' },
      { key: 'modelType', label: '모델 종류' },
      { key: 'factory', label: '생산 사업장' },
      { key: 'serialStart', label: '일련 번호 시작' },
      { key: 'serialEnd', label: '일련 번호 종료' },
      { key: 'ecu', label: '컨트롤 유니트' },
      { key: 'compFull', label: 'DTC 코드, 시스템/구성부품, 고장유형' },
      { key: 'standard', label: '기준' },
      { key: 'event', label: '고장이벤트' },
      { key: 'symptom', label: '증상' },
      { key: 'condition', label: '조건' },
      { key: 'preDtc', label: '선행조치DTC' },
      { key: 'causes', label: '가능한 이유' },
      { key: 'actions', label: '조치' }
    ];

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#0369a1'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#0284c7'; });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#0284c7';
      if (e.dataTransfer.files.length) handleMultipleFiles(Array.from(e.dataTransfer.files));
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleMultipleFiles(Array.from(e.target.files));
    });

    async function handleMultipleFiles(files) {
      const pdfFiles = files.filter(f => f.name.toLowerCase().endsWith('.pdf'));
      if (pdfFiles.length === 0) return;

      showProgress(0, pdfFiles.length, '구글 시트 기존 데이터 조회 중...');
      await fetchExistingData();

      for (let i = 0; i < pdfFiles.length; i++) {
        showProgress(i + 1, pdfFiles.length, `분석 중 (${i + 1}/${pdfFiles.length}): ${pdfFiles[i].name}`);
        const parsed = await parseSinglePdf(pdfFiles[i]);
        if (parsed) {
          evaluateStatus(parsed);
          parsedQueue.push(parsed);
        }
      }

      hideProgress();
      renderQueueTable();
    }

    async function fetchExistingData() {
      const url = document.getElementById('scriptUrl').value.trim();
      try {
        const res = await fetch(url);
        const data = await res.json();
        existingSheetData = Array.isArray(data) ? data : [];
      } catch (e) {
        existingSheetData = [];
      }
    }

    function parseSinglePdf(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = async function() {
          try {
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument({ data: typedarray, disableFontFace: true }).promise;
            let fullText = '';

            for (let p = 1; p <= pdf.numPages; p++) {
              const page = await pdf.getPage(p);
              const content = await page.getTextContent();
              const items = content.items.map(it => ({
                str: it.str.trim(),
                x: it.transform[4],
                y: it.transform[5]
              })).filter(it => it.str.length > 0);

              items.sort((a, b) => (b.y - a.y) || (a.x - b.x));

              let lines = [];
              let currY = null;
              let currLine = [];

              for (let it of items) {
                if (currY === null || Math.abs(it.y - currY) > 4) {
                  if (currLine.length) lines.push(currLine.join(' '));
                  currLine = [it.str];
                  currY = it.y;
                } else {
                  currLine.push(it.str);
                }
              }
              if (currLine.length) lines.push(currLine.join(' '));
              fullText += lines.join('\n') + '\n';
            }

            const data = parseExact14Fields(fullText);
            data.fileName = file.name;
            resolve(data);
          } catch(err) {
            resolve(null);
          }
        };
        reader.readAsArrayBuffer(file);
      });
    }

    function evaluateStatus(item) {
      const match = existingSheetData.find(e => (e.dtc || '').trim().toUpperCase() === item.dtc.trim().toUpperCase());
      if (!match) {
        item.status = 'NEW';
        item.checked = true;
      } else {
        let isDiff = false;
        for (let f of fieldLabels) {
          if ((match[f.key] || '').trim() !== (item[f.key] || '').trim()) {
            isDiff = true;
            break;
          }
        }
        item.status = isDiff ? 'MODIFIED' : 'DUPLICATE';
        item.checked = isDiff;
      }
    }

    function parseExact14Fields(text) {
      const clean = (s) => s ? s.replace(/\n+/g, ' ').trim() : '';
      const dtcMatch = text.match(/([P|U|B|C][0-9A-Z]{5,6}|PID\s*\d+|SE\d+-\d+)/);
      const dtc = dtcMatch ? dtcMatch[1].replace(/\s+/g, '') : '코드미상';

      let modelType = 'EW140E Volvo';
      let factory = '', serialStart = '', serialEnd = '';

      const serialBlock = text.match(/일련\s*번호에\s*대해\s*유효[\s\S]*?(?=ISO|컨트롤|$)/);
      if (serialBlock) {
        const lines = serialBlock[0].split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const dataLines = lines.filter(l => !l.includes('일련 번호에 대해 유효') && !l.includes('모델 종류') && !l.includes('생산 사업장'));
        if (dataLines.length > 0) {
          const rowText = dataLines.join(' ').replace(/\s+/g, ' ').trim();
          const mFull = rowText.match(/^(.*?)\s+([A-Za-z가-힣]+)\s+(\d{4,8})\s+(\d{4,8})$/);
          const m3 = rowText.match(/^(.*?)\s+([A-Za-z가-힣]+)\s+(\d{4,8})$/);
          const m2 = rowText.match(/^(.*?\bVolvo\b)\s+([A-Za-z가-힣]+)$/i);

          if (mFull) {
            modelType = mFull[1].trim(); factory = mFull[2].trim(); serialStart = mFull[3].trim(); serialEnd = mFull[4].trim();
          } else if (m3) {
            modelType = m3[1].trim(); factory = m3[2].trim(); serialStart = m3[3].trim();
          } else if (m2) {
            modelType = m2[1].trim(); factory = m2[2].trim();
          } else {
            modelType = rowText;
          }
        }
      }

      let ecu = '';
      const ecuMatch = text.match(/컨트롤\s*유니트\s*([^\n]+)/);
      if (ecuMatch) ecu = ecuMatch[1].replace(/DTC.*/, '').trim();

      let compFull = '';
      const compRegex = new RegExp("고장\\s*유형[\\s\\S]*?(" + dtc + "[\\s\\S]*?)(?=기준|$)", "i");
      const compMatch = text.match(compRegex);
      if (compMatch) {
        compFull = clean(compMatch[1]);
      } else {
        const altComp = text.match(/고장\s*유형\s*([^\n기준]+)/);
        if (altComp) compFull = dtc + ' ' + clean(altComp[1]);
      }

      const stdMatch = text.match(/기준\s*([\s\S]*?)(?=진단|$)/);
      const standard = clean(stdMatch ? stdMatch[1] : '냉각시스템, 개요');

      const evMatch = text.match(/고장\s*이벤트\s*([\s\S]*?)(?=증상|$)/);
      const event = clean(evMatch ? evMatch[1] : '');

      const symMatch = text.match(/증상\s*([\s\S]*?)(?=조건:?|$)/);
      let symptom = '없음';
      if (symMatch) {
        const sLines = symMatch[1].split(/[\n¡○•]+/).map(l => l.replace(/^[:\s]+/, '').trim()).filter(l => l && l !== '없음');
        if (sLines.length > 0) symptom = sLines.join(' | ');
      }

      const condMatch = text.match(/조건:?\s*([\s\S]*?)(?=선행조치|$)/);
      let condition = '없음';
      if (condMatch) {
        const cLines = condMatch[1].split(/[\n¡○•]+/).map(l => l.replace(/^[:\s]+/, '').trim()).filter(l => l && l !== '없음' && l !== ':');
        if (cLines.length > 0) condition = cLines.join(' | ');
      }

      const preMatch = text.match(/선행조치\s*DTC[\s\S]*?(?=가능한\s*이유|$)/);
      let preDtc = '없음';
      if (preMatch) {
        const codes = preMatch[0].match(/([A-Z][0-9A-Z]{5,6})/g) || [];
        const validCodes = codes.filter(c => c !== 'DTC' && c !== 'ISO' && !c.startsWith('DTC'));
        const uniqueCodes = [...new Set(validCodes)];
        if (uniqueCodes.length > 0) preDtc = uniqueCodes.join(' | ');
      }

      const causeMatch = text.match(/가능한\s*이유([\s\S]*?)(?=조치|$)/);
      let causes = '없음';
      if (causeMatch) {
        const cLines = causeMatch[1].split(/[\n¡○•]+/).map(l => l.replace(/^[:\s]+/, '').trim()).filter(l => l && l !== '없음');
        if (cLines.length > 0) causes = cLines.join(' | ');
      }

      const actMatch = text.match(/\n조치\s*([\s\S]*?)(?:Guided Diagnostics|$)/);
      let actions = '없음';
      if (actMatch) {
        const aLines = actMatch[1].split(/[\n¡○•]+/).map(l => l.replace(/^[:\s]+/, '').trim()).filter(l => l && l !== '없음');
        if (aLines.length > 0) actions = aLines.join(' | ');
      }

      return {
        dtc, modelType, factory, serialStart, serialEnd,
        ecu, compFull, standard, event, symptom,
        condition, preDtc, causes, actions
      };
    }

    function renderQueueTable() {
      const tbody = document.getElementById('fileTableBody');
      tbody.innerHTML = '';

      parsedQueue.forEach((item, idx) => {
        let badgeHtml = '';
        if (item.status === 'SAVED') badgeHtml = '<span class="badge badge-saved">저장 완료</span>';
        else if (item.status === 'NEW') badgeHtml = '<span class="badge badge-new">신규</span>';
        else if (item.status === 'DUPLICATE') badgeHtml = '<span class="badge badge-dup">동일 중복</span>';
        else if (item.status === 'MODIFIED') badgeHtml = '<span class="badge badge-mod">내용 변경</span>';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="text-align:center;"><input type="checkbox" ${item.checked ? 'checked' : ''} onchange="parsedQueue[${idx}].checked = this.checked"></td>
          <td style="font-weight:bold; color:#dc2626;">${item.dtc}</td>
          <td><b>${item.modelType}</b><br><span style="color:#64748b; font-size:11px;">${item.ecu}</span></td>
          <td>${item.compFull}</td>
          <td>${badgeHtml}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('listCard').style.display = 'block';
    }

    function toggleCheckAll(master) {
      parsedQueue.forEach(item => item.checked = master.checked);
      renderQueueTable();
    }

    async function startBatchSave() {
      const targets = parsedQueue.filter(item => item.checked && item.status !== 'SAVED');
      if (targets.length === 0) {
        alert('저장할 대상 파일이 없습니다.');
        return;
      }

      const url = document.getElementById('scriptUrl').value.trim();
      const btn = document.getElementById('btnBatchSave');
      btn.disabled = true;

      for (let i = 0; i < targets.length; i++) {
        const item = targets[i];
        showProgress(i + 1, targets.length, `구글 시트에 저장 중 (${i + 1}/${targets.length}): ${item.dtc}`);

        const formData = new URLSearchParams();
        for (let k in item) {
          if (k !== 'checked' && k !== 'status' && k !== 'fileName') {
            formData.append(k, item[k] || '');
          }
        }
        formData.append('mode', item.status === 'MODIFIED' ? 'overwrite' : 'append');

        try {
          await fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
          });
          item.status = 'SAVED';
          item.checked = false;
        } catch (e) {}
      }

      hideProgress();
      renderQueueTable();
      btn.disabled = false;
      alert('구글 시트에 일괄 저장이 완료되었습니다!');
    }

    function resetQueue() {
      parsedQueue = [];
      document.getElementById('listCard').style.display = 'none';
      document.getElementById('fileInput').value = '';
    }

    function showProgress(curr, total, text) {
      document.getElementById('progressBox').style.display = 'block';
      const pct = Math.round((curr / total) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').innerText = text;
    }

    function hideProgress() {
      document.getElementById('progressBox').style.display = 'none';
    }
  </script>
</body>
</html>
