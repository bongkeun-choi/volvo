<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>볼보 DTC/SAE 다중 파일 & 화면 캡처 통합 분석기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; }
    body { background: #f8fafc; color: #1e293b; padding-bottom: 60px; }
    .app-header { background: #0f172a; color: white; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .app-header h1 { font-size: 15px; font-weight: 800; }
    .btn-home { background: #0284c7; color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 800; }
    .container { max-width: 960px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 13.5px; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
    .paste-zone { border: 2.5px dashed #0284c7; padding: 40px 15px; text-align: center; border-radius: 14px; cursor: pointer; background: #f0f9ff; transition: all 0.2s; }
    .paste-zone:hover { background: #e0f2fe; border-color: #0369a1; }
    .paste-icon { font-size: 38px; margin-bottom: 8px; }
    .paste-title { font-size: 16.5px; font-weight: 900; color: #0284c7; margin-bottom: 6px; }
    .paste-desc { font-size: 13px; color: #64748b; line-height: 1.5; }
    .kbd-badge { background: #0f172a; color: white; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-weight: bold; }
    .option-box { background: #f1f5f9; padding: 12px 16px; border-radius: 8px; margin-top: 14px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 13px; font-weight: 700; }
    .option-group { display: flex; align-items: center; gap: 12px; }
    .queue-card { display: none; }
    .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .queue-title { font-size: 15px; font-weight: 800; color: #0f172a; }
    .queue-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; margin-bottom: 14px; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #f1f5f9; border-radius: 8px; font-size: 13px; font-weight: 700; }
    .queue-item.done { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .queue-item.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .queue-item.processing { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; display: inline-block; white-space: nowrap; }
    .badge-new { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .badge-variant { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
    .badge-dup { background: #ffedd5; color: #c2410c; border: 1px solid #fed7aa; }
    .badge-iso { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
    .badge-sae { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 12px; }
    th, td { border: 1px solid #cbd5e1; padding: 8px 10px; text-align: left; }
    th { background: #f8fafc; font-weight: 700; color: #475569; }
    .btn-group { display: flex; gap: 10px; margin-top: 16px; }
    .btn { flex: 1; padding: 13px; border: none; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; text-align: center; }
    .btn-success { background: #16a34a; color: white; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .status { margin-top: 12px; font-weight: bold; font-size: 13.5px; text-align: center; }
    .status.success { color: #16a34a; }
    .status.error { color: #dc2626; }
    .status.loading { color: #0284c7; }
  </style>
</head>
<body>
  <div class="app-header">
    <h1>🛠️ 볼보 DTC/SAE 다중 파일 & 화면 캡처 통합 분석기</h1>
    <a href="index.html" class="btn-home">🔍 진단서 조회 (홈)</a>
  </div>
  <div class="container">
    <div class="card">
      <div class="input-group">
        <label>Google Apps Script 웹 앱 URL:</label>
        <input type="text" id="scriptUrl" value="https://script.google.com/macros/s/AKfycbzV5H2kowUqmGNO2UloeU_2OMYT0ZbyyzsS3iN4LXLhY_WvZ1maxiIOZ9jvvCg99aM/exec">
      </div>
      <div class="paste-zone" id="pasteZone" onclick="document.getElementById('fileInput').click()">
        <div class="paste-icon">📑</div>
        <div class="paste-title">파일 선택 / 드래그 또는 <span class="kbd-badge">Ctrl + V</span> 붙여넣기</div>
        <div class="paste-desc">완전 동적 경계 계산 엔진으로 모든 종류의 볼보 PDF를 원본 그대로 분석합니다.</div>
        <input type="file" id="fileInput" multiple accept="image/*,application/pdf" style="display: none;">
      </div>
      <div class="option-box">
        <span>⚙️ 기존 시트와 중복 발생 시 동작:</span>
        <div class="option-group">
          <label style="font-weight:normal; margin:0; cursor:pointer;"><input type="radio" name="dupPolicy" value="overwrite" checked> 기존 데이터 덮어쓰기(갱신)</label>
          <label style="font-weight:normal; margin:0; cursor:pointer;"><input type="radio" name="dupPolicy" value="skip"> 중복 항목 저장 건너뛰기</label>
        </div>
      </div>
      <div id="status" class="status"></div>
    </div>
    <div class="card queue-card" id="queueCard">
      <div class="queue-header">
        <span class="queue-title">📋 분석 대기열 및 중복 판별 현황 (<span id="parsedCount">0</span>건)</span>
        <button class="btn-home" style="background:#64748b; font-size:11.5px;" onclick="clearQueue()">목록 초기화</button>
      </div>
      <div class="queue-list" id="queueList"></div>
      <table id="summaryTable">
        <thead>
          <tr>
            <th style="width: 12%;">구분</th>
            <th style="width: 18%;">에러코드 (DTC)</th>
            <th style="width: 28%;">적용 기종 / 일련번호(옵션)</th>
            <th style="width: 25%;">고장 유형 / 파라미터</th>
            <th style="width: 17%;">중복 검사 상태</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
      <div class="btn-group">
        <button id="btnSaveAll" class="btn btn-success" onclick="saveAllToGoogleSheet()" disabled>💾 분석된 모든 진단서 구글 시트에 일괄 저장하기</button>
      </div>
    </div>
  </div>

  <script>
    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = '';
    let parsedResults = [], existingDbItems = [];
    window.onload = () => { fetchExistingDb(); };

    async function fetchExistingDb() {
      const url = document.getElementById('scriptUrl').value.trim();
      try {
        const res = await fetch(url, { method: 'GET', redirect: 'follow' });
        const data = await res.json();
        if (Array.isArray(data)) existingDbItems = data;
      } catch (err) { console.warn('DB 로드 실패:', err); }
    }

    window.addEventListener('paste', (e) => {
      const items = e.clipboardData.items;
      const files = [];
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) files.push(items[i].getAsFile());
      }
      if (files.length > 0) { handleMultipleFiles(files); e.preventDefault(); }
    });

    const pasteZone = document.getElementById('pasteZone'), fileInput = document.getElementById('fileInput');
    pasteZone.addEventListener('dragover', (e) => { e.preventDefault(); pasteZone.style.borderColor = '#0369a1'; });
    pasteZone.addEventListener('dragleave', () => { pasteZone.style.borderColor = '#0284c7'; });
    pasteZone.addEventListener('drop', (e) => { 
      e.preventDefault(); 
      pasteZone.style.borderColor = '#0284c7'; 
      if (e.dataTransfer.files.length) handleMultipleFiles(Array.from(e.dataTransfer.files)); 
    });
    fileInput.addEventListener('change', (e) => { 
      if (e.target.files.length) handleMultipleFiles(Array.from(e.target.files)); 
    });

    async function handleMultipleFiles(files) {
      if (!files || files.length === 0) return;
      document.getElementById('queueCard').style.display = 'block';
      await fetchExistingDb();
      showStatus(`${files.length}개 파일 순차 분석 시작...`, 'loading');

      for (let i = 0; i < files.length; i++) {
        const file = files[i], itemIndex = parsedResults.length;
        addQueueItemUI(itemIndex, file.name || `캡처 이미지 #${itemIndex + 1}`);

        try {
          let resObj = null;
          if (file.type.startsWith('image/')) {
            updateQueueStatus(itemIndex, '이미지 OCR 분석 중...', 'processing');
            resObj = await processImageOCR(file);
          } else if (file.name.toLowerCase().endsWith('.pdf')) {
            updateQueueStatus(itemIndex, 'PDF 동적 레이아웃 분석 중...', 'processing');
            resObj = await processPdf(file);
          }

          if (resObj && resObj.item) {
            const itemToSave = resObj.item;
            itemToSave.docType = resObj.docType;

            const dtcClean = String(itemToSave.dtc || '').toUpperCase().replace(/[\s\-_]/g, '');
            const curModel = String(itemToSave.modelType || '').trim();
            const curStart = String(itemToSave.serialStart || '').trim();
            const curEnd = String(itemToSave.serialEnd || '').trim();
            const curEvent = String(itemToSave.event || itemToSave.paramName || '').trim();

            const matchExisting = existingDbItems.filter(d => String(d.dtc || '').toUpperCase().replace(/[\s\-_]/g, '') === dtcClean);
            let dupStatus = 'NEW';
            if (matchExisting.length > 0) {
              const exactMatch = matchExisting.find(d => 
                String(d.modelType || '').trim() === curModel && 
                String(d.serialStart || '').trim() === curStart && 
                String(d.serialEnd || '').trim() === curEnd && 
                (d.type === 'sae' || String(d.event || '').trim() === curEvent)
              );
              dupStatus = exactMatch ? 'EXACT_DUP' : 'VARIANT_NEW';
            }

            itemToSave._dupStatus = dupStatus;
            parsedResults.push(itemToSave);
            updateQueueStatus(itemIndex, `✅ [${resObj.docType.toUpperCase()}] ${itemToSave.dtc} 완료`, 'done');
            addSummaryRow(itemToSave);
          } else { throw new Error('고장코드 추출 불가'); }
        } catch (err) { updateQueueStatus(itemIndex, `❌ 실패 (${err.message})`, 'error'); }
      }

      document.getElementById('parsedCount').innerText = parsedResults.length;
      document.getElementById('btnSaveAll').disabled = parsedResults.length === 0;
      showStatus(`분석 완료: 총 ${parsedResults.length}건 준비됨`, 'success');
      fileInput.value = '';
    }

    function processImageOCR(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async function() {
          try {
            const base64Data = reader.result.split(',')[1];
            const url = document.getElementById('scriptUrl').value.trim();
            const response = await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'parse_image', imageBase64: base64Data, mimeType: file.type || 'image/png' }) });
            const resJson = await response.json();
            if (resJson.status === 'success') resolve(resJson);
            else reject(new Error(resJson.error || '파싱 실패'));
          } catch (err) { reject(err); }
        };
        reader.readAsDataURL(file);
      });
    }

    // 완전 동적 PDF 분석 엔진 (하드코딩 좌표 0개)
    function processPdf(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async function() {
          try {
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument({ data: typedarray, disableFontFace: true }).promise;
            let allItems = [];

            for (let p = 1; p <= pdf.numPages; p++) {
              const page = await pdf.getPage(p);
              const content = await page.getTextContent();
              content.items.forEach(it => {
                const str = it.str.trim();
                if (str.length > 0) {
                  allItems.push({
                    str: str,
                    x: it.transform[4],
                    y: it.transform[5] + (pdf.numPages - p) * 1000,
                    width: it.width || (str.length * 8)
                  });
                }
              });
            }

            // 1. 물리적 행(Line) 단위 동적 조립 (Y좌표 오차 3.5pt 이내)
            let lines = [];
            allItems.forEach(it => {
              let line = lines.find(l => Math.abs(l.y - it.y) <= 3.5);
              if (!line) {
                line = { y: it.y, items: [] };
                lines.push(line);
              }
              line.items.push(it);
            });
            lines.sort((a, b) => b.y - a.y);
            lines.forEach(l => {
              l.items.sort((a, b) => a.x - b.x);
              l.text = l.items.map(it => it.str).join(' ').trim();
            });

            const fullRawText = lines.map(l => l.text).join('\n');
            const isSae = /MID\s*\d+|PID\s*\d+|SID\s*\d+|FMI\s*\d+/i.test(fullRawText);

            const BULLET_CLEAN_REGEX = /^[¡○•●\u00A1\s\-:]+|[¡○•●\u00A1\s\-:]+$/g;
            const isBulletStart = (str) => /^[¡○•●\u00A1]/.test(str.trim());

            // 2. 동적 기준선 계산 (좌측 라벨들의 실제 우측 경계선 측정)
            function getDynamicLabelBoundary() {
              const labelKeywords = ['컨트롤', '유니트', 'DTC', '고장', '유형', '구성부품', '기준', '이벤트', '증상', '조건', '선행조치', '가능한', '이유', '조치', '모델', '옵션'];
              let maxRight = 80;

              allItems.forEach(it => {
                if (it.x < 180 && labelKeywords.some(k => it.str.includes(k))) {
                  const right = it.x + (it.width || (it.str.length * 8));
                  if (right > maxRight && right < 220) maxRight = right;
                }
              });
              return maxRight + 2; // 라벨 끝점 + 2pt 여유
            }

            const dynamicSplitX = getDynamicLabelBoundary();

            // 3. 상단 다중 표(옵션표 + 일련번호표) 동적 분리
            function parseTopTablesDynamically() {
              let parsedRows = [];
              let currentMode = null;

              for (let i = 0; i < lines.length; i++) {
                const t = lines[i].text;
                
                if (t.includes('옵션') && (t.includes('구성') || t.includes('유효'))) {
                  currentMode = 'OPTION';
                  continue;
                } else if (t.includes('일련 번호에 대해 유효') || (t.includes('일련 번호') && t.includes('시작'))) {
                  currentMode = 'SERIAL';
                  continue;
                } else if (t.includes('ISO DTC') || t.includes('SAE 코드') || t.includes('컨트롤 유니트') || t.includes('장비 디스플레이')) {
                  break;
                }

                if (!currentMode) continue;
                if (t.includes('모델 종류') || t.includes('옵션 번호') || t.includes('생산 사업장') || t.includes('일련 번호')) continue;

                const tokens = lines[i].items.map(it => it.str.trim()).filter(Boolean);
                if (tokens.length < 2) continue;

                if (currentMode === 'OPTION') {
                  const optIdx = tokens.findIndex(tok => /^\d{6,8}$/.test(tok));
                  if (optIdx !== -1) {
                    const mType = tokens.slice(0, optIdx).join(' ');
                    const optNum = tokens[optIdx];
                    const rest = tokens.slice(optIdx + 1);
                    const half = Math.ceil(rest.length / 2);
                    const optName = rest.slice(0, half).join(' ') || 'Volvo Active Control';
                    const compName = rest.slice(half).join(' ') || optName;
                    parsedRows.push({ model: mType, factory: `[옵션] ${optNum}`, start: optName, end: compName });
                  }
                } else if (currentMode === 'SERIAL') {
                  if (tokens.length >= 4) {
                    const sEnd = tokens[tokens.length - 1];
                    const sStart = tokens[tokens.length - 2];
                    const fact = tokens[tokens.length - 3];
                    const mType = tokens.slice(0, tokens.length - 3).join(' ').replace(/모델\s*종류\s*:?/g, '').trim();
                    if (/^\d{4,8}$/.test(sStart) && /^\d{4,8}$/.test(sEnd)) {
                      parsedRows.push({ model: mType, factory: fact, start: sStart, end: sEnd });
                    }
                  }
                }
              }

              return {
                modelType: parsedRows.length > 0 ? parsedRows.map(r => r.model).join(' | ') : 'EC300E L Volvo',
                factory: parsedRows.length > 0 ? parsedRows.map(r => r.factory).join(' | ') : 'Changwon',
                serialStart: parsedRows.length > 0 ? parsedRows.map(r => r.start).join(' | ') : '316001',
                serialEnd: parsedRows.length > 0 ? parsedRows.map(r => r.end).join(' | ') : '320000'
              };
            }

            const topData = parseTopTablesDynamically();

            if (isSae) {
              // --- SAE J1939 파싱 ---
              const mid = (fullRawText.match(/MID\s*(\d+)/i) || ['', '128'])[1];
              const pidMatch = fullRawText.match(/(PID|PPID|SID|PSID)\s*(\d+)/i) || ['', 'PID', '100'];
              const pidType = pidMatch[1], pid = pidMatch[2];
              const dtc = `MID${mid} ${pidType}${pid}`;

              let displayMsg = `${mid} ${pidType}${pid}`;
              const dispLine = lines.find(l => l.text.includes('텍스트') && l.text.includes('프레젠테이션'));
              if (dispLine) {
                const row = dispLine.items.filter(it => it.x >= dynamicSplitX);
                if (row.length) displayMsg = row.map(it => it.str).join(' ').trim();
              }

              let ecu = `MID${mid} 엔진 ECU`;
              const ecuLine = lines.find(l => l.text.includes('컨트롤') && l.text.includes('유니트'));
              if (ecuLine) {
                const row = ecuLine.items.filter(it => it.x >= dynamicSplitX);
                if (row.length) ecu = `MID${mid} ` + row.map(it => it.str).join(' ').replace(/MID\d+/g, '').replace(/^[:\s\-]+/, '').trim();
              }

              let paramName = `${pidType}${pid}`;
              const paramLine = lines.find(l => (l.text.includes('PID') || l.text.includes('SID')) && l.items[0].x < dynamicSplitX);
              if (paramLine) {
                const row = paramLine.items.filter(it => it.x >= dynamicSplitX);
                if (row.length) paramName = `${pidType}${pid} ` + row.map(it => it.str).join(' ').replace(new RegExp(`^${pidType}\\s*${pid}`, 'i'), '').replace(/^[:\s\-]+/, '').trim();
              }

              let standard = '';
              const stdLine = lines.find(l => l.text.includes('기준') && !l.text.includes('고장 모드'));
              if (stdLine) {
                const row = stdLine.items.filter(it => it.x >= dynamicSplitX);
                if (row.length) standard = row.map(it => it.str).join(' ').trim();
              }

              const fmiAnchors = allItems.filter(it => /^FMI\s*(\d+)$/i.test(it.str) || /고장\s*모드\s*FMI\s*(\d+)/i.test(it.str));
              const fmiList = [];

              for (let i = 0; i < fmiAnchors.length; i++) {
                const curAnchor = fmiAnchors[i];
                const fmiNum = (curAnchor.str.match(/\d+/) || ['3'])[0];
                const blockTopY = curAnchor.y + 15;
                const blockBottomY = (i < fmiAnchors.length - 1) ? fmiAnchors[i + 1].y + 15 : 0;
                const blockItems = allItems.filter(it => it.y <= blockTopY && it.y > blockBottomY);

                const condAnchor = blockItems.find(it => it.str.includes('탐지') || it.str.includes('조건'));
                const symAnchor = blockItems.find(it => it.str.includes('증상'));
                const causeAnchor = blockItems.find(it => it.str.includes('가능한') || it.str.includes('이유'));
                const actAnchor = blockItems.find(it => it.str.includes('조치'));

                let cond = '-';
                if (condAnchor) {
                  const condBottomY = symAnchor ? (symAnchor.y + 2) : (condAnchor.y - 30);
                  const cItems = blockItems.filter(it => it.y <= (condAnchor.y + 6) && it.y >= condBottomY && it.x > (condAnchor.x - 10));
                  cItems.sort((a, b) => (Math.abs(b.y - a.y) > 2 ? b.y - a.y : a.x - b.x));
                  cond = cItems.map(it => it.str).join(' ').replace(/.*?탐지\s*조건\s*:\s*/i, '').replace(/^[:\s\-]+/, '').replace(BULLET_CLEAN_REGEX, '').trim() || '-';
                }

                let actions = displayMsg;
                if (actAnchor) {
                  const aItems = blockItems.filter(it => Math.abs(it.y - actAnchor.y) <= 8 && it.x > (actAnchor.x + 10));
                  aItems.sort((a, b) => a.x - b.x);
                  if (aItems.length) actions = aItems.map(it => it.str).join(' ').trim();
                }

                const splitFmiX = causeAnchor ? (causeAnchor.x - 10) : 310;
                const tableTopY = symAnchor ? (symAnchor.y - 2) : (blockTopY - 20);
                const tableBottomY = actAnchor ? (actAnchor.y + 5) : (blockBottomY + 10);
                const isLabelNoise = (s) => /^(증상|가능한\s*이유|고장\s*모드|FMI\s*\d+|조치)\s*:?$/i.test(s.trim());

                const leftItems = blockItems.filter(it => it.x < splitFmiX && it.y <= tableTopY && it.y >= tableBottomY && !isLabelNoise(it.str));
                const rightItems = blockItems.filter(it => it.x >= splitFmiX && it.y <= tableTopY && it.y >= tableBottomY && !isLabelNoise(it.str));

                function assemble(items) {
                  items.sort((a, b) => (Math.abs(b.y - a.y) > 2 ? b.y - a.y : a.x - b.x));
                  let bLines = [], currY = null, currLine = [];
                  items.forEach(it => {
                    if (currY === null || Math.abs(it.y - currY) > 4) {
                      if (currLine.length) bLines.push(currLine.join(' '));
                      currLine = [it.str];
                      currY = it.y;
                    } else {
                      currLine.push(it.str);
                    }
                  });
                  if (currLine.length) bLines.push(currLine.join(' '));

                  let bullets = [];
                  bLines.forEach(line => {
                    let text = line.trim();
                    if (!text || text === '없음') return;
                    if (isBulletStart(text) || bullets.length === 0) {
                      let cleaned = text.replace(BULLET_CLEAN_REGEX, '').trim();
                      if (cleaned) bullets.push(cleaned);
                    } else {
                      let cleaned = text.replace(BULLET_CLEAN_REGEX, '').trim();
                      if (cleaned) bullets[bullets.length - 1] += ' ' + cleaned;
                    }
                  });
                  return bullets.length > 0 ? Array.from(new Set(bullets)).join(' | ') : '없음';
                }

                fmiList.push({
                  fmi: fmiNum,
                  cond: cond,
                  symptom: assemble(leftItems),
                  causes: assemble(rightItems),
                  actions: actions
                });
              }

              resolve({
                docType: 'sae',
                item: {
                  dtc: dtc, displayMsg: displayMsg, modelType: topData.modelType, factory: topData.factory,
                  serialStart: topData.serialStart, serialEnd: topData.serialEnd, ecu: ecu, paramName: paramName,
                  standard: standard, fmiList: fmiList
                }
              });
            } else {
              // --- ISO DTC 결합 파싱 ---
              let dtc = '';
              const dtcMatch = fullRawText.match(/([P|U|B|C][0-9A-Z]{5,7})/);
              if (dtcMatch) dtc = dtcMatch[1].replace(/\s+/g, '');

              let ecu = '일반 용도 장비의 전자 컨트롤 유닛 2';
              const ecuLine = lines.find(l => l.text.includes('컨트롤') && l.text.includes('유니트'));
              if (ecuLine) {
                const row = ecuLine.items.filter(it => it.x >= dynamicSplitX);
                if (row.length) ecu = row.map(it => it.str).join(' ').trim();
              }

              let compFull = dtc;
              const compLine = lines.find(l => l.text.includes('DTC 코드') || l.text.includes('고장 유형') || l.text.includes('구성부품'));
              if (compLine) {
                const row = compLine.items.filter(it => it.x >= dynamicSplitX);
                if (row.length) compFull = row.map(it => it.str).join(' ').trim();
              }

              let standard = '';
              const stdLine = lines.find(l => l.text.includes('기준') && !l.text.includes('진단') && !l.text.includes('고장'));
              if (stdLine) {
                const row = stdLine.items.filter(it => it.x >= dynamicSplitX);
                if (row.length) standard = row.map(it => it.str).join(' ').trim();
              }

              // 정밀 라벨 검색 (선행조치와 조치 완벽 분리)
              function getSectionIdx(keyword, excludeKeyword) {
                return lines.findIndex(l => {
                  const firstItem = l.items[0] || {};
                  if (firstItem.x > dynamicSplitX) return false;
                  const t = l.text.replace(/\s+/g, '');
                  if (excludeKeyword && t.includes(excludeKeyword)) return false;
                  return t.includes(keyword);
                });
              }

              const idxEvent = getSectionIdx('고장이벤트');
              const idxSym = getSectionIdx('증상');
              const idxCond = getSectionIdx('조건');
              const idxPre = getSectionIdx('선행조치');
              const idxCause = getSectionIdx('가능한이유');
              const idxAct = getSectionIdx('조치', '선행');
              const idxEnd = lines.findIndex(l => l.text.includes('Guided Diagnostics') || l.text.includes('주석:'));

              // 우측 본문($X \ge dynamicSplitX$) 줄바꿈 문장 완벽 결합
              function extractSection(startIdx, endIdx) {
                if (startIdx === -1) return '없음';
                const actualEnd = (endIdx !== -1) ? endIdx : (lines.length);
                const secLines = lines.slice(startIdx, actualEnd);

                let bullets = [];
                secLines.forEach((l) => {
                  const contentItems = l.items.filter(it => it.x >= dynamicSplitX);
                  const lineContent = contentItems.map(it => it.str).join(' ').trim();
                  if (!lineContent || lineContent === '없음' || lineContent === '¡' || lineContent === '○') return;

                  const isBullet = isBulletStart(lineContent) || l.items.some(it => (it.str === '¡' || it.str === '○') && it.x >= dynamicSplitX);
                  const cleaned = lineContent.replace(BULLET_CLEAN_REGEX, '').trim();
                  if (!cleaned || cleaned === '없음') return;

                  if (isBullet || bullets.length === 0) {
                    bullets.push(cleaned);
                  } else {
                    bullets[bullets.length - 1] += ' ' + cleaned;
                  }
                });

                return bullets.length > 0 ? Array.from(new Set(bullets)).join(' | ') : '없음';
              }

              let eventText = extractSection(idxEvent, idxSym);
              let symptomText = extractSection(idxSym, idxCond);
              let condText = extractSection(idxCond, idxPre);

              let preDtcText = '없음';
              if (idxPre !== -1) {
                const rawPre = extractSection(idxPre, idxCause);
                if (rawPre && rawPre !== '없음') {
                  const codes = rawPre.match(/([P|U|B|C][0-9A-Z]{5,7})/g) || [];
                  const validCodes = codes.filter(c => c !== dtc && !c.startsWith('DTC'));
                  preDtcText = validCodes.length > 0 ? Array.from(new Set(validCodes)).join(' | ') : (rawPre.includes('없음') ? '없음' : rawPre);
                }
              }

              let causesText = extractSection(idxCause, idxAct);
              let actionsText = extractSection(idxAct, idxEnd !== -1 ? idxEnd : lines.length);

              resolve({
                docType: 'iso',
                item: {
                  dtc: dtc,
                  modelType: topData.modelType,
                  factory: topData.factory,
                  serialStart: topData.serialStart,
                  serialEnd: topData.serialEnd,
                  ecu: ecu,
                  compFull: compFull,
                  standard: standard,
                  event: eventText,
                  symptom: symptomText,
                  condition: condText,
                  preDtc: preDtcText,
                  causes: causesText,
                  actions: actionsText
                }
              });
            }
          } catch (err) { reject(err); }
        };
        reader.readAsArrayBuffer(file);
      });
    }

    async function saveAllToGoogleSheet() {
      if (parsedResults.length === 0) return;
      const url = document.getElementById('scriptUrl').value.trim();
      const btn = document.getElementById('btnSaveAll');
      const dupPolicy = document.querySelector('input[name="dupPolicy"]:checked').value;
      btn.disabled = true;

      let targetItems = parsedResults;
      if (dupPolicy === 'skip') {
        targetItems = parsedResults.filter(r => r._dupStatus === 'NEW' || r._dupStatus === 'VARIANT_NEW');
        if (targetItems.length === 0) { alert('저장할 신규 항목이 없습니다.'); btn.disabled = false; return; }
      }

      showStatus(`구글 시트에 ${targetItems.length}건 정밀 저장 중...`, 'loading');
      let savedCount = 0;
      for (let item of targetItems) {
        try {
          item.mode = 'overwrite';
          await fetch(url, { method: 'POST', body: JSON.stringify(item) });
          savedCount++;
        } catch (err) { console.error(err); }
      }
      await fetchExistingDb();
      showStatus(`🎉 총 ${savedCount}건의 진단서가 시트에 정상 저장되었습니다!`, 'success');
      btn.disabled = false;
    }

    function addQueueItemUI(idx, name) {
      const qList = document.getElementById('queueList'), div = document.createElement('div');
      div.id = `qItem_${idx}`; div.className = 'queue-item processing';
      div.innerHTML = `<span>📄 ${name}</span><span class="status-badge">분석 중...</span>`;
      qList.appendChild(div);
    }

    function updateQueueStatus(idx, msg, type) {
      const el = document.getElementById(`qItem_${idx}`);
      if (el) { el.className = `queue-item ${type}`; el.querySelector('.status-badge').innerText = msg; }
    }

    function addSummaryRow(d) {
      const tbody = document.getElementById('summaryBody'), tr = document.createElement('tr');
      let tabBadge = (d.docType === 'sae') ? '<span class="badge badge-sae">SAE</span>' : '<span class="badge badge-iso">ISO</span>';
      let dupBadge = '<span class="badge badge-new">🟢 신규 등록</span>';
      if (d._dupStatus === 'VARIANT_NEW') dupBadge = '<span class="badge badge-variant">🟡 변종 (별도저장)</span>';
      else if (d._dupStatus === 'EXACT_DUP') dupBadge = '<span class="badge badge-dup">🟠 기존 덮어쓰기</span>';

      const isOpt = String(d.factory || '').startsWith('[옵션]');
      let serialInfo = '';
      if (isOpt) {
        serialInfo = `<br><span style="font-size:11px; color:#0284c7;">${d.factory} : ${d.serialStart}</span>`;
      } else if (d.factory || d.serialStart || d.serialEnd) {
        serialInfo = `<br><span style="font-size:11px; color:#0284c7;">[${d.factory || '-'}] #${d.serialStart || '시작'}~${d.serialEnd || '종료'}</span>`;
      }

      let detailText = (d.docType === 'sae') ? `<b>${d.paramName || ''}</b><br><span style="color:#64748b;">(FMI ${(d.fmiList||[]).length}개 모드)</span>` : (d.compFull || d.event || '-');

      tr.innerHTML = `<td>${tabBadge}</td><td><b>${d.dtc}</b></td><td><b>${d.modelType || 'Volvo'}</b>${serialInfo}</td><td>${detailText}</td><td>${dupBadge}</td>`;
      tbody.appendChild(tr);
    }

    function clearQueue() {
      parsedResults = [];
      document.getElementById('queueList').innerHTML = ''; 
      document.getElementById('summaryBody').innerHTML = '';
      document.getElementById('parsedCount').innerText = '0'; 
      document.getElementById('btnSaveAll').disabled = true;
      document.getElementById('queueCard').style.display = 'none'; 
      document.getElementById('status').textContent = ''; 
      document.getElementById('fileInput').value = '';
    }

    function showStatus(msg, type) { 
      const el = document.getElementById('status'); 
      el.textContent = msg; 
      el.className = 'status ' + type; 
    }
  </script>
