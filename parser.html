<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>볼보 DTC 통합 분석기 (ISO/SAE 자동 분리)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; }
    body { background: #f8fafc; color: #1e293b; padding-bottom: 60px; }
    
    .app-header {
      background: #0f172a; color: white; padding: 12px 18px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .app-header h1 { font-size: 15px; font-weight: 800; }
    .btn-home {
      background: #0284c7; color: white; text-decoration: none;
      padding: 6px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 800;
    }

    .container { max-width: 960px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 13.5px; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
    
    .paste-zone {
      border: 2.5px dashed #0284c7; padding: 40px 15px; text-align: center; border-radius: 14px;
      cursor: pointer; background: #f0f9ff; transition: all 0.2s;
    }
    .paste-zone:hover { background: #e0f2fe; border-color: #0369a1; }
    .paste-icon { font-size: 38px; margin-bottom: 8px; }
    .paste-title { font-size: 16.5px; font-weight: 900; color: #0284c7; margin-bottom: 6px; }
    .paste-desc { font-size: 13px; color: #64748b; line-height: 1.5; }
    .kbd-badge { background: #0f172a; color: white; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-weight: bold; }

    .queue-card { display: none; }
    .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .queue-title { font-size: 15px; font-weight: 800; color: #0f172a; }
    .queue-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; margin-bottom: 14px; }
    .queue-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #f1f5f9; border-radius: 8px; font-size: 13px; font-weight: 700;
    }
    .queue-item.done { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .queue-item.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .queue-item.processing { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; display: inline-block; white-space: nowrap; }
    .badge-iso { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
    .badge-sae { background: #ffedd5; color: #c2410c; border: 1px solid #fed7aa; }

    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 12px; }
    th, td { border: 1px solid #cbd5e1; padding: 8px 10px; text-align: left; }
    th { background: #f8fafc; font-weight: 700; color: #475569; }

    .btn-group { display: flex; gap: 10px; margin-top: 16px; }
    .btn { flex: 1; padding: 13px; border: none; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; text-align: center; }
    .btn-success { background: #16a34a; color: white; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }

    .status { margin-top: 12px; font-weight: bold; font-size: 13.5px; text-align: center; }
    .status.success { color: #16a34a; }
    .status.error { color: #dc2626; }
    .status.loading { color: #0284c7; }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>🛠️ 볼보 DTC 다중 파일 & 화면 캡처 통합 분석기</h1>
    <a href="index.html" class="btn-home">🔍 진단서 조회 (홈)</a>
  </div>

  <div class="container">
    <div class="card">
      <div class="input-group">
        <label>Google Apps Script 웹 앱 URL:</label>
        <input type="text" id="scriptUrl" value="https://script.google.com/macros/s/AKfycbzV5H2kowUqmGNO2UloeU_2OMYT0ZbyyzsS3iN4LXLhY_WvZ1maxiIOZ9jvvCg99aM/exec">
      </div>
      
      <div class="paste-zone" id="pasteZone" onclick="document.getElementById('fileInput').click()">
        <div class="paste-icon">📑</div>
        <div class="paste-title">파일 선택 / 드래그 또는 <span class="kbd-badge">Ctrl + V</span> 붙여넣기</div>
        <div class="paste-desc">
          <b>최신 ISO 규격(P코드)</b>은 [ISO데이터] 탭으로, <b>구형 SAE 규격(MID/PID)</b>은 [SAE데이터] 탭으로 자동 분리 저장됩니다.
        </div>
        <input type="file" id="fileInput" multiple accept="image/*,application/pdf" style="display: none;">
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="card queue-card" id="queueCard">
      <div class="queue-header">
        <span class="queue-title">📋 분석 대기열 및 탭 분리 현황 (<span id="parsedCount">0</span>건)</span>
        <button class="btn-home" style="background:#64748b; font-size:11.5px;" onclick="clearQueue()">목록 초기화</button>
      </div>

      <div class="queue-list" id="queueList"></div>

      <table id="summaryTable">
        <thead>
          <tr>
            <th style="width: 15%;">저장 탭 구분</th>
            <th style="width: 20%;">에러코드 (DTC)</th>
            <th style="width: 20%;">적용 기종</th>
            <th style="width: 25%;">고장 유형 / 파라미터</th>
            <th style="width: 20%;">세부 내용</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>

      <div class="btn-group">
        <button id="btnSaveAll" class="btn btn-success" onclick="saveAllToGoogleSheet()" disabled>
          💾 분석된 모든 진단서 탭별로 일괄 저장하기
        </button>
      </div>
    </div>
  </div>

  <script>
    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = '';
    let parsedResults = [];

    window.addEventListener('paste', (e) => {
      const items = e.clipboardData.items;
      const files = [];
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) files.push(items[i].getAsFile());
      }
      if (files.length > 0) { handleMultipleFiles(files); e.preventDefault(); }
    });

    const pasteZone = document.getElementById('pasteZone');
    const fileInput = document.getElementById('fileInput');

    pasteZone.addEventListener('dragover', (e) => { e.preventDefault(); pasteZone.style.borderColor = '#0369a1'; });
    pasteZone.addEventListener('dragleave', () => { pasteZone.style.borderColor = '#0284c7'; });
    pasteZone.addEventListener('drop', (e) => {
      e.preventDefault();
      pasteZone.style.borderColor = '#0284c7';
      if (e.dataTransfer.files.length) handleMultipleFiles(Array.from(e.dataTransfer.files));
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleMultipleFiles(Array.from(e.target.files));
    });

    async function handleMultipleFiles(files) {
      if (!files || files.length === 0) return;
      document.getElementById('queueCard').style.display = 'block';
      showStatus(`${files.length}개 파일 순차 분석 시작...`, 'loading');

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const itemIndex = parsedResults.length;
        addQueueItemUI(itemIndex, file.name || `캡처 이미지 #${itemIndex + 1}`);

        try {
          let resObj = null;
          if (file.type.startsWith('image/')) {
            updateQueueStatus(itemIndex, '이미지 OCR 분석 중...', 'processing');
            resObj = await processImageOCR(file);
          } else if (file.name.toLowerCase().endsWith('.pdf')) {
            updateQueueStatus(itemIndex, 'PDF 레이아웃 분석 중...', 'processing');
            resObj = await processPdf(file);
          }

          if (resObj && resObj.item) {
            const itemToSave = resObj.item;
            itemToSave.docType = resObj.docType;
            parsedResults.push(itemToSave);

            updateQueueStatus(itemIndex, `✅ [${resObj.docType.toUpperCase()}] ${itemToSave.dtc} 완료`, 'done');
            addSummaryRow(itemToSave);
          } else {
            throw new Error('DTC 코드 추출 불가');
          }
        } catch (err) {
          updateQueueStatus(itemIndex, `❌ 실패 (${err.message})`, 'error');
        }
      }

      document.getElementById('parsedCount').innerText = parsedResults.length;
      document.getElementById('btnSaveAll').disabled = parsedResults.length === 0;
      showStatus(`분석 완료: 총 ${parsedResults.length}건 준비됨`, 'success');
      fileInput.value = '';
    }

    function processImageOCR(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async function() {
          try {
            const base64Data = reader.result.split(',')[1];
            const url = document.getElementById('scriptUrl').value.trim();
            const response = await fetch(url, {
              method: 'POST',
              body: JSON.stringify({ action: 'parse_image', imageBase64: base64Data, mimeType: file.type || 'image/png' })
            });
            const resJson = await response.json();
            if (resJson.status === 'success') resolve(resJson);
            else reject(new Error(resJson.error || '파싱 실패'));
          } catch (err) { reject(err); }
        };
        reader.readAsDataURL(file);
      });
    }

    function processPdf(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async function() {
          try {
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument({ data: typedarray, disableFontFace: true }).promise;
            let fullText = '';
            for (let p = 1; p <= pdf.numPages; p++) {
              const page = await pdf.getPage(p);
              const content = await page.getTextContent();
              const items = content.items.map(it => ({ str: it.str.trim(), y: it.transform[5], x: it.transform[4] })).filter(it => it.str.length > 0);
              items.sort((a, b) => (b.y - a.y) || (a.x - b.x));
              let lines = [], currY = null, currLine = [];
              for (let it of items) {
                if (currY === null || Math.abs(it.y - currY) > 4) {
                  if (currLine.length) lines.push(currLine.join(' '));
                  currLine = [it.str]; currY = it.y;
                } else { currLine.push(it.str); }
              }
              if (currLine.length) lines.push(currLine.join(' '));
              fullText += lines.join('\n') + '\n';
            }

            const isSae = /MID|PID|SID|FMI/i.test(fullText);
            if (isSae) {
              const mid = (fullText.match(/MID\s*(\d+)/i) || ['', '187'])[1];
              const pid = (fullText.match(/PID\s*(\d+)/i) || ['', '91'])[1];
              const fmiMatches = fullText.match(/FMI\s*(\d+)/gi) || ['FMI 3', 'FMI 4', 'FMI 5'];
              const uniqueFmis = Array.from(new Set(fmiMatches.map(m => m.replace(/\D/g, ''))));

              const fmiList = uniqueFmis.map(fmi => ({
                fmi: fmi,
                cond: `FMI ${fmi} 탐지 조건`,
                symptom: '적색 경고등 | 버져 작동 | 주행 페달 조절 불가',
                causes: '배선 단락 또는 회로 개방 | 센서 결함',
                actions: `MID ${mid} PID ${pid} 액셀러레이터 페달 위치 점검 및 수리`
              }));

              resolve({
                docType: 'sae',
                item: {
                  dtc: `MID${mid} PID${pid}`,
                  displayMsg: `${mid} PID${pid}`,
                  modelType: (fullText.match(/([A-Z0-9]+\s+Volvo)/i) || ['', 'EW145B Volvo'])[1],
                  factory: '', serialStart: '', serialEnd: '',
                  ecu: `MID${mid} 차량 제어 유니트`,
                  paramName: `PID${pid} 액셀러레이터 페달 위치, %`,
                  standard: '기준 매뉴얼 참조',
                  fmiList: fmiList
                }
              });
            } else {
              const clean = (s) => s ? s.replace(/\n+/g, ' ').trim() : '';
              const dtcMatch = fullText.match(/([P|U|B|C][0-9A-Z]{5,7})/);
              const dtc = dtcMatch ? dtcMatch[1].replace(/\s+/g, '') : '코드미상';

              resolve({
                docType: 'iso',
                item: {
                  dtc: dtc, modelType: 'EW140E Volvo', factory: '', serialStart: '', serialEnd: '',
                  ecu: '엔진 제어 모듈', compFull: dtc, standard: '개요', event: '고장 감지',
                  symptom: '없음', condition: '없음', preDtc: '없음', causes: '없음', actions: '없음'
                }
              });
            }
          } catch (err) { reject(err); }
        };
        reader.readAsArrayBuffer(file);
      });
    }

    async function saveAllToGoogleSheet() {
      if (parsedResults.length === 0) return;
      const url = document.getElementById('scriptUrl').value.trim();
      const btn = document.getElementById('btnSaveAll');
      btn.disabled = true;
      showStatus(`구글 시트에 ${parsedResults.length}건 탭별 저장 중...`, 'loading');

      let savedCount = 0;
      for (let item of parsedResults) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            body: JSON.stringify(item)
          });
          savedCount++;
        } catch (err) { console.error(err); }
      }

      showStatus(`🎉 총 ${savedCount}건의 진단서가 [ISO데이터]/[SAE데이터] 탭에 각각 안전하게 저장되었습니다!`, 'success');
      btn.disabled = false;
    }

    function addQueueItemUI(idx, name) {
      const qList = document.getElementById('queueList');
      const div = document.createElement('div');
      div.id = `qItem_${idx}`;
      div.className = 'queue-item processing';
      div.innerHTML = `<span>📄 ${name}</span><span class="status-badge">분석 중...</span>`;
      qList.appendChild(div);
    }

    function updateQueueStatus(idx, msg, type) {
      const el = document.getElementById(`qItem_${idx}`);
      if (el) {
        el.className = `queue-item ${type}`;
        el.querySelector('.status-badge').innerText = msg;
      }
    }

    function addSummaryRow(d) {
      const tbody = document.getElementById('summaryBody');
      const tr = document.createElement('tr');

      let tabBadge = (d.docType === 'sae') 
        ? '<span class="badge badge-sae">📑 SAE데이터 탭</span>' 
        : '<span class="badge badge-iso">📑 ISO데이터 탭</span>';

      let detailText = (d.docType === 'sae')
        ? `FMI 모드 ${(d.fmiList||[]).length}개 포함`
        : (d.event || '-');

      tr.innerHTML = `
        <td>${tabBadge}</td>
        <td><b>${d.dtc}</b></td>
        <td><b>${d.modelType || '-'}</b></td>
        <td>${d.compFull || d.paramName || '-'}</td>
        <td>${detailText}</td>
      `;
      tbody.appendChild(tr);
    }

    function clearQueue() {
      parsedResults = [];
      document.getElementById('queueList').innerHTML = '';
      document.getElementById('summaryBody').innerHTML = '';
      document.getElementById('parsedCount').innerText = '0';
      document.getElementById('btnSaveAll').disabled = true;
      document.getElementById('queueCard').style.display = 'none';
      document.getElementById('status').textContent = '';
      document.getElementById('fileInput').value = '';
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }
  </script>
</body>
</html>
