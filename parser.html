<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>볼보 DTC 화면 캡처 & PDF 분석기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; }
    body { background: #f8fafc; color: #1e293b; padding-bottom: 60px; }
    
    .app-header {
      background: #0f172a; color: white; padding: 12px 18px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .app-header h1 { font-size: 15px; font-weight: 800; }
    .btn-home {
      background: #0284c7; color: white; text-decoration: none;
      padding: 6px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 800;
    }

    .container { max-width: 960px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 13.5px; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
    
    /* 캡처 붙여넣기 & 드래그 영역 */
    .paste-zone {
      border: 2.5px dashed #0284c7; padding: 45px 15px; text-align: center; border-radius: 14px;
      cursor: pointer; background: #f0f9ff; transition: all 0.2s;
    }
    .paste-zone:hover { background: #e0f2fe; border-color: #0369a1; }
    .paste-icon { font-size: 40px; margin-bottom: 10px; }
    .paste-title { font-size: 17px; font-weight: 900; color: #0284c7; margin-bottom: 6px; }
    .paste-desc { font-size: 13px; color: #64748b; line-height: 1.5; }
    .kbd-badge { background: #0f172a; color: white; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-weight: bold; }

    /* 이미지 미리보기 썸네일 */
    .img-preview-box { text-align: center; margin-top: 15px; display: none; }
    .img-preview-box img { max-width: 100%; max-height: 250px; border-radius: 8px; border: 1px solid #cbd5e1; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

    /* 상태 텍스트 */
    .status { margin-top: 15px; font-weight: bold; font-size: 14px; text-align: center; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
    .loading { color: #0284c7; }

    /* 미리보기 테이블 */
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
    th, td { border: 1px solid #cbd5e1; padding: 10px 12px; text-align: left; }
    th { background: #f8fafc; font-weight: 700; color: #475569; width: 28%; }
    td { background: #ffffff; line-height: 1.5; font-weight: 500; }

    .btn-group { display: flex; gap: 10px; margin-top: 18px; }
    .btn { flex: 1; padding: 13px; border: none; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; text-align: center; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-warning { background: #f59e0b; color: white; }
    .btn-secondary { background: #64748b; color: white; }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>🛠️ 볼보 DTC 화면 캡처 & 분석기</h1>
    <a href="index.html" class="btn-home">🔍 진단서 조회 (홈)</a>
  </div>

  <div class="container">
    <div class="card">
      <div class="input-group">
        <label>Google Apps Script 웹 앱 URL:</label>
        <input type="text" id="scriptUrl" value="https://script.google.com/macros/s/AKfycbzV5H2kowUqmGNO2UloeU_2OMYT0ZbyyzsS3iN4LXLhY_WvZ1maxiIOZ9jvvCg99aM/exec">
      </div>
      
      <!-- 캡처 붙여넣기 및 파일 드래그 존 -->
      <div class="paste-zone" id="pasteZone" onclick="document.getElementById('fileInput').click()">
        <div class="paste-icon">📋</div>
        <div class="paste-title">화면 캡처 후 여기서 <span class="kbd-badge">Ctrl + V</span> 를 누르세요</div>
        <div class="paste-desc">
          또는 클릭하여 <b>이미지(.png, .jpg)</b> 또는 <b>PDF 파일</b>을 선택하세요 (드래그 앤 드롭 지원)
        </div>
        <input type="file" id="fileInput" accept="image/*,application/pdf" style="display: none;">
      </div>

      <div class="img-preview-box" id="imgPreviewBox">
        <img id="captureImg" src="" alt="캡처 이미지 미리보기">
      </div>

      <div id="status" class="status"></div>
    </div>

    <!-- 14개 필드 분석 결과 카드 -->
    <div class="card" id="resultCard" style="display: none;">
      <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 6px;">🔍 분석된 DTC 데이터 (14개 필드)</h3>
      <table id="previewTable"></table>

      <div class="btn-group">
        <button id="btnSave" class="btn btn-primary" onclick="saveToGoogleSheet()">구글 시트에 저장하기</button>
        <button class="btn btn-secondary" onclick="resetForm()">초기화</button>
      </div>
    </div>
  </div>

  <script>
    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = '';
    let parsedData = null;

    const fieldLabels = [
      { key: 'dtc', label: '에러코드' },
      { key: 'modelType', label: '모델 종류' },
      { key: 'factory', label: '생산 사업장' },
      { key: 'serialStart', label: '일련 번호 시작' },
      { key: 'serialEnd', label: '일련 번호 종료' },
      { key: 'ecu', label: '컨트롤 유니트' },
      { key: 'compFull', label: 'DTC 코드, 시스템/구성부품, 고장유형' },
      { key: 'standard', label: '기준' },
      { key: 'event', label: '고장이벤트' },
      { key: 'symptom', label: '증상' },
      { key: 'condition', label: '조건' },
      { key: 'preDtc', label: '선행조치DTC' },
      { key: 'causes', label: '가능한 이유' },
      { key: 'actions', label: '조치' }
    ];

    // ==========================================
    // 1. 키보드 Ctrl + V 클립보드 이미지 자동 감지
    // ==========================================
    window.addEventListener('paste', (e) => {
      const items = e.clipboardData.items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const blob = items[i].getAsFile();
          handleImageFile(blob);
          e.preventDefault();
          break;
        }
      }
    });

    // 2. 파일 드래그 & 클릭 선택 처리
    const pasteZone = document.getElementById('pasteZone');
    const fileInput = document.getElementById('fileInput');

    pasteZone.addEventListener('dragover', (e) => { e.preventDefault(); pasteZone.style.borderColor = '#0369a1'; });
    pasteZone.addEventListener('dragleave', () => { pasteZone.style.borderColor = '#0284c7'; });
    pasteZone.addEventListener('drop', (e) => {
      e.preventDefault();
      pasteZone.style.borderColor = '#0284c7';
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (file.type.startsWith('image/')) {
        handleImageFile(file);
      } else if (file.name.toLowerCase().endsWith('.pdf')) {
        handlePdfFile(file);
      } else {
        alert('이미지(.png, .jpg) 또는 PDF 파일만 지원합니다.');
      }
    }

    // 이미지 파일 -> Base64 변환 후 클라우드 OCR 요청
    function handleImageFile(file) {
      showStatus('📸 캡처 이미지 분석 중... (클라우드 OCR)', 'loading');
      document.getElementById('resultCard').style.display = 'none';

      // 썸네일 미리보기 표시
      const previewBox = document.getElementById('imgPreviewBox');
      const img = document.getElementById('captureImg');
      img.src = URL.createObjectURL(file);
      previewBox.style.display = 'block';

      const reader = new FileReader();
      reader.onload = async function() {
        try {
          const base64Data = reader.result.split(',')[1];
          const url = document.getElementById('scriptUrl').value.trim();

          const response = await fetch(url, {
            method: 'POST',
            body: JSON.stringify({
              action: 'parse_image',
              imageBase64: base64Data,
              mimeType: file.type || 'image/png'
            })
          });

          const resJson = await response.json();
          if (resJson.status === 'success' && resJson.parsed) {
            parsedData = resJson.parsed;
            renderPreviewTable(parsedData);
            showStatus(`✅ 캡처 화면에서 고장 코드 [${parsedData.dtc}] 분석 완료!`, 'success');
          } else {
            throw new Error(resJson.error || '텍스트를 읽지 못했습니다.');
          }
        } catch (err) {
          showStatus('❌ 분석 실패: ' + err.message, 'error');
        }
      };
      reader.readAsDataURL(file);
    }

    // PDF 파일 처리
    async function handlePdfFile(file) {
      showStatus('📄 PDF 문서 레이아웃 분석 중...', 'loading');
      document.getElementById('imgPreviewBox').style.display = 'none';
      document.getElementById('resultCard').style.display = 'none';

      const reader = new FileReader();
      reader.onload = async function() {
        try {
          const typedarray = new Uint8Array(this.result);
          const pdf = await pdfjsLib.getDocument({ data: typedarray, disableFontFace: true }).promise;
          let fullText = '';

          for (let p = 1; p <= pdf.numPages; p++) {
            const page = await pdf.getPage(p);
            const content = await page.getTextContent();
            const items = content.items.map(it => ({ str: it.str.trim(), x: it.transform[4], y: it.transform[5] })).filter(it => it.str.length > 0);
            items.sort((a, b) => (b.y - a.y) || (a.x - b.x));

            let lines = [], currY = null, currLine = [];
            for (let it of items) {
              if (currY === null || Math.abs(it.y - currY) > 4) {
                if (currLine.length) lines.push(currLine.join(' '));
                currLine = [it.str];
                currY = it.y;
              } else {
                currLine.push(it.str);
              }
            }
            if (currLine.length) lines.push(currLine.join(' '));
            fullText += lines.join('\n') + '\n';
          }

          // 클라이언트 파서 호출
          parsedData = parseExact14FieldsClient(fullText);
          renderPreviewTable(parsedData);
          showStatus(`✅ PDF에서 고장 코드 [${parsedData.dtc}] 분석 완료!`, 'success');
        } catch (err) {
          showStatus('❌ PDF 분석 실패: ' + err.message, 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function renderPreviewTable(data) {
      const table = document.getElementById('previewTable');
      table.innerHTML = '';
      fieldLabels.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<th>${item.label}</th><td>${data[item.key] || '-'}</td>`;
        table.appendChild(tr);
      });
      document.getElementById('resultCard').style.display = 'block';
    }

    async function saveToGoogleSheet() {
      if (!parsedData) return;
      const url = document.getElementById('scriptUrl').value.trim();
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      showStatus('구글 시트에 저장 중...', 'loading');

      try {
        const formData = new URLSearchParams();
        for (let k in parsedData) {
          formData.append(k, parsedData[k] || '');
        }
        formData.append('mode', 'overwrite'); // 동일 DTC 존재 시 덮어쓰기

        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString()
        });

        showStatus(`✅ 구글 시트에 [${parsedData.dtc}] 진단서가 안전하게 저장되었습니다!`, 'success');
        btn.disabled = false;
      } catch (err) {
        showStatus('❌ 저장 실패: ' + err.message, 'error');
        btn.disabled = false;
      }
    }

    function resetForm() {
      parsedData = null;
      document.getElementById('imgPreviewBox').style.display = 'none';
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('status').textContent = '';
      document.getElementById('fileInput').value = '';
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    // PDF용 보조 정규식 파서
    function parseExact14FieldsClient(text) {
      const clean = (s) => s ? s.replace(/\n+/g, ' ').trim() : '';
      const dtcMatch = text.match(/([P|U|B|C][0-9A-Z]{5,6}|PID\s*\d+|SE\d+-\d+)/);
      const dtc = dtcMatch ? dtcMatch[1].replace(/\s+/g, '') : '코드미상';

      let modelType = 'EW140E Volvo', factory = '', serialStart = '', serialEnd = '';
      const serialBlock = text.match(/일련\s*번호에\s*대해\s*유효[\s\S]*?(?=ISO|컨트롤|$)/);
      if (serialBlock) {
        const lines = serialBlock[0].split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const dataLines = lines.filter(l => !l.includes('일련 번호에 대해 유효') && !l.includes('모델 종류') && !l.includes('생산 사업장'));
        if (dataLines.length > 0) {
          const rowText = dataLines.join(' ').replace(/\s+/g, ' ').trim();
          const mFull = rowText.match(/^(.*?)\s+([A-Za-z가-힣]+)\s+(\d{4,8})\s+(\d{4,8})$/);
          if (mFull) { modelType = mFull[1]; factory = mFull[2]; serialStart = mFull[3]; serialEnd = mFull[4]; }
          else modelType = rowText;
        }
      }

      let ecu = '';
      const ecuMatch = text.match(/컨트롤\s*유니트\s*([^\n]+)/);
      if (ecuMatch) ecu = ecuMatch[1].replace(/DTC.*/, '').trim();

      let compFull = '';
      const compRegex = new RegExp("고장\\s*유형[\\s\\S]*?(" + dtc + "[\\s\\S]*?)(?=기준|$)", "i");
      const compMatch = text.match(compRegex);
      if (compMatch) compFull = clean(compMatch[1]);

      const stdMatch = text.match(/기준\s*([\s\S]*?)(?=진단|$)/);
      const standard = clean(stdMatch ? stdMatch[1] : '개요');

      const evMatch = text.match(/고장\s*이벤트\s*([\s\S]*?)(?=증상|$)/);
      const event = clean(evMatch ? evMatch[1] : '');

      const symMatch = text.match(/증상\s*([\s\S]*?)(?=조건:?|$)/);
      let symptom = '없음';
      if (symMatch) {
        const sLines = symMatch[1].split(/[\n¡○•]+/).map(l => l.replace(/^[:\s]+/, '').trim()).filter(l => l && l !== '없음');
        if (sLines.length > 0) symptom = sLines.join(' | ');
      }

      const condMatch = text.match(/조건:?\s*([\s\S]*?)(?=선행조치|$)/);
      let condition = '없음';
      if (condMatch) {
        const cLines = condMatch[1].split(/[\n¡○•]+/).map(l => l.replace(/^[:\s]+/, '').trim()).filter(l => l && l !== '없음' && l !== ':');
        if (cLines.length > 0) condition = cLines.join(' | ');
      }

      const preMatch = text.match(/선행조치\s*DTC[\s\S]*?(?=가능한\s*이유|$)/);
      let preDtc = '없음';
      if (preMatch) {
        const codes = preMatch[0].match(/([A-Z][0-9A-Z]{5,6})/g) || [];
        const validCodes = codes.filter(c => c !== 'DTC' && c !== 'ISO' && !c.startsWith('DTC'));
        const uniqueCodes = [...new Set(validCodes)];
        if (uniqueCodes.length > 0) preDtc = uniqueCodes.join(' | ');
      }

      const causeMatch = text.match(/가능한\s*이유([\s\S]*?)(?=조치|$)/);
      let causes = '없음';
      if (causeMatch) {
        const cLines = causeMatch[1].split(/[\n¡○•]+/).map(l => l.replace(/^[:\s]+/, '').trim()).filter(l => l && l !== '없음');
        if (cLines.length > 0) causes = cLines.join(' | ');
      }

      const actMatch = text.match(/\n조치\s*([\s\S]*?)(?:Guided Diagnostics|$)/);
      let actions = '없음';
      if (actMatch) {
        const aLines = actMatch[1].split(/[\n¡○•]+/).map(l => l.replace(/^[:\s]+/, '').trim()).filter(l => l && l !== '없음');
        if (aLines.length > 0) actions = aLines.join(' | ');
      }

      return { dtc, modelType, factory, serialStart, serialEnd, ecu, compFull, standard, event, symptom, condition, preDtc, causes, actions };
    }
  </script>
</body>
</html>
