<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>볼보 DTC 통합 파서 (ISO/SAE 지원)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #f8fafc; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; max-width: 800px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .paste-zone { border: 2px dashed #0284c7; padding: 40px; text-align: center; cursor: pointer; border-radius: 8px; margin-top: 10px; background: #f0f9ff; }
    input[type="text"] { width: 100%; padding: 10px; margin-bottom: 10px; }
    .btn { background: #16a34a; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    #status { margin-top: 10px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🛠️ 볼보 진단서 파서 (자동 분류)</h2>
    <input type="text" id="scriptUrl" value="https://script.google.com/macros/s/AKfycbzV5H2kowUqmGNO2UloeU_2OMYT0ZbyyzsS3iN4LXLhY_WvZ1maxiIOZ9jvvCg99aM/exec">
    <div class="paste-zone" onclick="document.getElementById('fileInput').click()">
      <h3>여기를 클릭하거나 파일을 드래그하세요</h3>
      <p>ISO(P코드) 및 SAE(MID/PID) 모두 지원합니다.</p>
    </div>
    <input type="file" id="fileInput" accept="image/*,application/pdf" style="display:none;">
    <button class="btn" id="btnSave" onclick="saveData()">시트에 일괄 저장</button>
    <div id="status"></div>
  </div>

  <script>
    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = '';
    let parsedQueue = [];

    document.querySelector('.paste-zone').addEventListener('dragover', e => e.preventDefault());
    document.querySelector('.paste-zone').addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
    document.getElementById('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));
    window.addEventListener('paste', e => {
      const items = e.clipboardData.items;
      for (let i=0; i<items.length; i++) if (items[i].type.startsWith('image/')) handleFile(items[i].getAsFile());
    });

    async function handleFile(file) {
      if(!file) return;
      document.getElementById('status').innerText = "분석 중...";
      try {
        if(file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = async () => {
            const base64 = reader.result.split(',')[1];
            const res = await fetch(document.getElementById('scriptUrl').value, { method: 'POST', body: JSON.stringify({ action: 'parse_image', imageBase64: base64, mimeType: file.type }) });
            const json = await res.json();
            if(json.item) { parsedQueue.push(json); document.getElementById('status').innerText = `${json.docType.toUpperCase()} 코드 추출 완료! 저장 버튼을 누르세요.`; }
          };
          reader.readAsDataURL(file);
        } else {
          document.getElementById('status').innerText = "PDF 지원은 서버 OCR로 진행됩니다. 스크립트를 확인하세요.";
        }
      } catch(e) { document.getElementById('status').innerText = "오류 발생: " + e.message; }
    }

    async function saveData() {
      if(!parsedQueue.length) return;
      document.getElementById('status').innerText = "저장 중...";
      for(let obj of parsedQueue) {
        let payload = obj.item;
        payload.docType = obj.docType;
        await fetch(document.getElementById('scriptUrl').value, { method: 'POST', body: JSON.stringify(payload) });
      }
      parsedQueue = [];
      document.getElementById('status').innerText = "✅ 저장 완료되었습니다!";
    }
  </script>
</body>
</html>
